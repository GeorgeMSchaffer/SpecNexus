apiVersion: v1
kind: ConfigMap
metadata:
  name: sargent-nexus-client-config
  namespace: {{ .Values.namespace.name }}
data:
  appsettings.json: |
    {
      "ApiBaseUrl": {{ .Values.client.config.apiBaseUrl | quote }}
    }
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
