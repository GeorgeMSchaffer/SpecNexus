apiVersion: apps/v1
kind: Deployment
metadata:
  name: sargent-nexus-client
  namespace: {{ .Values.namespace.name }}
  labels:
    app: sargent-nexus-client
    tier: client
spec:
  replicas: {{ .Values.client.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sargent-nexus-client
  template:
    metadata:
      labels:
        app: sargent-nexus-client
        tier: client
    spec:
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.client.service.targetPort }}
              name: http
          volumeMounts:
            - name: client-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: client-config
              mountPath: /usr/share/nginx/html/appsettings.json
              subPath: appsettings.json
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
{{ toYaml .Values.client.resources | indent 12 }}
      volumes:
        - name: client-config
          configMap:
            name: sargent-nexus-client-config
