apiVersion: apps/v1
kind: Deployment
metadata:
  name: sargent-nexus-api
  namespace: {{ .Values.namespace.name }}
  labels:
    app: sargent-nexus-api
    tier: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sargent-nexus-api
  template:
    metadata:
      labels:
        app: sargent-nexus-api
        tier: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: sargent-nexus-api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sqlserver.secretName }}
                  key: {{ .Values.sqlserver.secretKeys.connectionString }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readinessInitialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.probes.livenessInitialDelaySeconds }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
