{{- if and .Values.networkPolicy.enabled .Values.sqlserver.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sargent-nexus-sqlserver
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: sargent-nexus-sqlserver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: api
      ports:
        - protocol: TCP
          port: {{ .Values.sqlserver.service.port }}
{{- end }}
