{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sargent-nexus
  namespace: {{ .Values.namespace.name }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sargent-nexus-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /playground
            pathType: Prefix
            backend:
              service:
                name: sargent-nexus-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: sargent-nexus-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sargent-nexus-client
                port:
                  number: {{ .Values.client.service.port }}
{{- end }}
