api:
  image:
    pullPolicy: IfNotPresent
  config:
    aspNetCoreEnvironment: Production
    swaggerEnabled: "false"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

client:
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

sqlserver:
  image:
    pullPolicy: IfNotPresent
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
