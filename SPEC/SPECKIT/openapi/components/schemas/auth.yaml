LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
LoginSuccessResponse:
  type: object
  required: [accessToken, expiresInSeconds, requiresPasswordChange, user]
  properties:
    accessToken:
      type: string
    expiresInSeconds:
      type: integer
    requiresPasswordChange:
      type: boolean
    user:
      $ref: ./common.yaml#/UserSummary
ChangePasswordRequest:
  type: object
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
    newPassword:
      type: string
SelfRegistrationRequest:
  type: object
  required: [inviteCode, firstName, lastName, email, password]
  properties:
    inviteCode:
      type: string
      maxLength: 16
    firstName:
      type: string
      maxLength: 100
    lastName:
      type: string
      maxLength: 100
    email:
      type: string
      format: email
    password:
      type: string
SelfRegistrationResponse:
  type: object
  required: [userId, organizationId, email, role, status]
  properties:
    userId:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    email:
      type: string
      format: email
    role:
      type: string
    status:
      type: string
