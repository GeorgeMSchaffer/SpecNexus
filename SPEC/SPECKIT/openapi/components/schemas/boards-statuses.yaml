BoardWriteRequest:
  type: object
  required: [name, allowUserStatusUpdate, swimlanes]
  properties:
    name:
      type: string
    allowUserStatusUpdate:
      type: boolean
    swimlanes:
      type: array
      minItems: 2
      items:
        $ref: '#/Swimlane'
BoardSummary:
  type: object
  required: [boardId, organizationId, name, allowUserStatusUpdate, swimlanes]
  properties:
    boardId:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    name:
      type: string
    allowUserStatusUpdate:
      type: boolean
    swimlanes:
      type: array
      items:
        $ref: '#/Swimlane'
BoardDetail:
  allOf:
    - $ref: '#/BoardSummary'
ReorderRequest:
  type: object
  required: [swimlanes]
  properties:
    swimlanes:
      type: array
      items:
        $ref: '#/Swimlane'
Swimlane:
  type: object
  required: [statusId, order]
  properties:
    statusId:
      type: string
      format: uuid
    order:
      type: integer
